name: Golden Path bootstrap integration

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/golden-path-bootstrap.yml"
      - ".github/workflows/docs.yml"
      - "docs/decisions/0006-adopt-developer-tooling-golden-path.md"
      - "docs/guides/adopting-developer-tooling.md"
      - "docs/guides/bootstrap-new-repository.md"
      - "docs/guides/github-hosting-capabilities.md"
      - "docs/guides/migrating-developer-tooling.md"
      - "docs/guides/golden-path-bootstrap.v1.json"
      - "docs/guides/schemas/**"
      - "docs/standards/developer-tooling/**"
      - "scripts/docs/check-golden-path-bootstrap.sh"
      - "scripts/docs/check-golden-path-integration.py"
      - "scripts/docs/fixtures/golden-path-adoption/**"
      - "scripts/docs/fixtures/golden-path-bootstrap/**"
      - "workflow-templates/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/golden-path-bootstrap.yml"
      - ".github/workflows/docs.yml"
      - "docs/decisions/0006-adopt-developer-tooling-golden-path.md"
      - "docs/guides/adopting-developer-tooling.md"
      - "docs/guides/bootstrap-new-repository.md"
      - "docs/guides/github-hosting-capabilities.md"
      - "docs/guides/migrating-developer-tooling.md"
      - "docs/guides/golden-path-bootstrap.v1.json"
      - "docs/guides/schemas/**"
      - "docs/standards/developer-tooling/**"
      - "scripts/docs/check-golden-path-bootstrap.sh"
      - "scripts/docs/check-golden-path-integration.py"
      - "scripts/docs/fixtures/golden-path-adoption/**"
      - "scripts/docs/fixtures/golden-path-bootstrap/**"
      - "workflow-templates/**"
  workflow_dispatch:

permissions: {}

concurrency:
  group: golden-path-bootstrap-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    name: Validate released Golden Path bootstrap
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate policy-owned integration contract
        run: python3 scripts/docs/check-golden-path-integration.py

      - name: Prepare isolated verifier toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/golden-path-verifier"
          printf '%s\n' \
            '[tools]' \
            'actionlint = "1.7.12"' \
            'github-cli = "2.97.0"' \
            >"$RUNNER_TEMP/golden-path-verifier/mise.toml"

      - name: Install exact GitHub CLI verifier
        uses: jdx/mise-action@9e7f7633ff6f6d6048a9418a68d48f288f50eb14 # v4.2.3
        with:
          version: 2026.7.17
          sha256: 8aba14e84ffeb312ca600f1a16b23c217c0d7f55c64d93f867f754efed3d8a43
          working_directory: ${{ runner.temp }}/golden-path-verifier
          install: true
          cache: false

      - name: Validate workflow syntax
        run: |
          actionlint .github/workflows/docs.yml \
            .github/workflows/golden-path-bootstrap.yml \
            workflow-templates/golden-path-quality.yml

      - name: Set up verified Golden Path executable
        id: golden-path
        uses: 5010-dev/engineering-tooling/actions/setup-golden-path@36767ad2b289b46e2af1257484c8db27ea45062e
        with:
          checker-version: '1.2.3'
          source-commit: '36767ad2b289b46e2af1257484c8db27ea45062e'
          github-cli-version: '2.97.0'
          darwin-amd64-sha256: 'f5441ddaebc9cb58d4ff39a0d9d51315a92892a958b7bd08284ff197fe7a65db'
          darwin-arm64-sha256: '32ac3478f5e29d740e82614376b2ce21307e8cd6b95eaede0acceac5b5a374e8'
          linux-amd64-sha256: '1fc67c2f75727c47156dc4db199868659cc86f0b2540279f6698f2e8a1fff1c2'
          linux-arm64-sha256: '4e247b827e71016e88cd4541f2a192663b69a36a88cf1808ea21502d092c23e7'

      - name: Exercise immutable bootstrap fixture
        env:
          GH_TOKEN: ${{ github.token }}
          GOLDEN_PATH_BIN: ${{ steps.golden-path.outputs.binary-path }}
        run: scripts/docs/check-golden-path-bootstrap.sh
