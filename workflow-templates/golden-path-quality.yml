name: Developer Tooling / Conformance

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    uses: 5010-dev/engineering-tooling/.github/workflows/golden-path-quality.yml@e5820e01e31c8395c33e4a6087db87600369943f
    with:
      runner: ubuntu-24.04
      working-directory: .
      # Replace this invalid JSON sentinel with the exact profile array in
      # .github/golden-path.yaml. It deliberately fails closed until replaced.
      profiles: 'REPLACE_WITH_EXACT_PROFILES'
      checker-version: '1.2.0'
      source-commit: 'e5820e01e31c8395c33e4a6087db87600369943f'
      github-cli-version: '2.97.0'
      darwin-amd64-sha256: '38780123fe8647043a1ca13bad2a474eac37b0829ee3505e7b7548f4befe94d3'
      darwin-arm64-sha256: 'df219c0d9cb5e5df90d940bafbda20639a3b4e857b34d28d04fde22debdc09cd'
      linux-amd64-sha256: '61b1de815aafcff6f99c9e0d60c14446d0c6e3865ac09942165dacbba2b2b133'
      linux-arm64-sha256: 'e0b16544985495cbcfa297c3762f6e19f973ff9c3acb54ce17dbe6cba445f4bb'
