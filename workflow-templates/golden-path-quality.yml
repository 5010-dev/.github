name: Developer Tooling / Conformance

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    uses: 5010-dev/engineering-tooling/.github/workflows/golden-path-quality.yml@b0ec12860a673d95b02391c19b545653938ac059
    with:
      runner: ubuntu-24.04
      working-directory: .
      # Replace this invalid JSON sentinel with the exact profile array in
      # .github/golden-path.yaml. It deliberately fails closed until replaced.
      profiles: 'REPLACE_WITH_EXACT_PROFILES'
      checker-version: '1.2.1'
      source-commit: 'b0ec12860a673d95b02391c19b545653938ac059'
      github-cli-version: '2.97.0'
      darwin-amd64-sha256: 'e231a5aa16148d46ee6187214918bcaae5e89c17719af48b185f4015e1efade8'
      darwin-arm64-sha256: 'b363fc4522282c525dc56834aa5963384a3fe190a66936ad6b3b5e4a920c5cfa'
      linux-amd64-sha256: '29bac9344f52d8d6c6fba8b81290cdc5ab255bc476237191003820a312698df0'
      linux-arm64-sha256: '47c14927e63fa9cc45fe88a59e24655127ed6cbcffa48d79cf2a730aa91de5a9'
