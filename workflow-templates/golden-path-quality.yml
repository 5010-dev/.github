name: Developer Tooling / Conformance

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    uses: 5010-dev/engineering-tooling/.github/workflows/golden-path-quality.yml@36767ad2b289b46e2af1257484c8db27ea45062e
    with:
      runner: ubuntu-24.04
      working-directory: .
      # Replace this invalid JSON sentinel with the exact profile array in
      # .github/golden-path.yaml. It deliberately fails closed until replaced.
      profiles: 'REPLACE_WITH_EXACT_PROFILES'
      checker-version: '1.2.3'
      source-commit: '36767ad2b289b46e2af1257484c8db27ea45062e'
      github-cli-version: '2.97.0'
      darwin-amd64-sha256: 'f5441ddaebc9cb58d4ff39a0d9d51315a92892a958b7bd08284ff197fe7a65db'
      darwin-arm64-sha256: '32ac3478f5e29d740e82614376b2ce21307e8cd6b95eaede0acceac5b5a374e8'
      linux-amd64-sha256: '1fc67c2f75727c47156dc4db199868659cc86f0b2540279f6698f2e8a1fff1c2'
      linux-arm64-sha256: '4e247b827e71016e88cd4541f2a192663b69a36a88cf1808ea21502d092c23e7'
