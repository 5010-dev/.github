name: Developer Tooling / Conformance

on:
  pull_request:
    branches: [$default-branch]
  push:
    branches: [$default-branch]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: golden-path-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  conformance:
    uses: 5010-dev/engineering-tooling/.github/workflows/golden-path-quality.yml@ce66d80e5a18d76d8094af9c481a31a656fa881b
    with:
      runner: ubuntu-24.04
      working-directory: .
      # Replace this invalid JSON sentinel with the exact profile array in
      # .github/golden-path.yaml. It deliberately fails closed until replaced.
      profiles: 'REPLACE_WITH_EXACT_PROFILES'
      checker-version: '1.0.0'
      source-commit: 'ce66d80e5a18d76d8094af9c481a31a656fa881b'
      github-cli-version: '2.97.0'
      darwin-amd64-sha256: '1c9088632c17bc7c30baf573bed6c294c73f3d2e65f821885cdd7b1542859712'
      darwin-arm64-sha256: 'bf878d3d4033934865f0e7e0d2dbfa42cbbaa79cfa43185c42672f451c93847e'
      linux-amd64-sha256: '6dcfb6d480942e96554da81f6f254791859fa4614197cbf5edf2d5bb318f08b6'
      linux-arm64-sha256: 'ee35378fa39c60720ab4b1d804aacf0ad71263b3aabbb2cf669912f56428b5e7'
